<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Құбыр желісін іске қос!</title>
<style>
*{box-sizing:border-box}
:root{font-family:system-ui,sans-serif;color:#122b3e;background:#102838}
body{margin:0;min-height:100dvh;display:grid;place-items:center}
[hidden]{display:none!important}
main{width:min(100vw,177.7778dvh);aspect-ratio:16/9;position:relative;isolation:isolate;container-type:inline-size;overflow:hidden;background:linear-gradient(#a9d5f5 62%,#845c42 62% 75%,#dbb789 75% 81%,#624d40 81%)}
.scene{position:absolute;inset:0;z-index:-1}
.scene img{position:absolute;width:100%;height:100%}
.fallback{position:absolute;top:33%;width:12%;height:29%;background:linear-gradient(90deg,#104368,#409fcc,#1f6c95);border-radius:18% 18% 4% 4%}
.fallback.building{right:0;background:#eee4cc;border-top:1.5cqw solid #267688;border-radius:0}
.window{position:absolute;left:94.4%;top:47%;width:4.9%;height:7.8%;border-radius:5%;background:#ffe495;box-shadow:0 0 2cqw #ffd477;opacity:0;transition:opacity .5s}
.ready .window{opacity:.85}
.line{position:absolute;left:13.2%;width:73.1%;top:73.5%;height:4.7%;display:grid;grid-template-columns:repeat(8,1fr)}
.slot{position:relative;border:1px dashed #fff5d9ab;border-radius:.25cqw;background:#192d3850}
.slot.built{border-color:transparent;background:none}
.pipe,.riser{background:linear-gradient(#12475c,#4caac0 20%,#257d97 45%,#0a3448 88%);box-shadow:0 .3cqw .4cqw #0e22375c}
.pipe{position:absolute;inset:-1px;border-radius:.25cqw;visibility:hidden;border-right:.52cqw ridge #74b7c3}
.built .pipe{visibility:visible;animation:drop .65s both}
@keyframes drop{0%{opacity:0;transform:translateY(-300%)}68%{opacity:1;transform:translateY(4%)}100%{transform:translateY(0)}}
.riser{position:absolute;top:57%;height:18.7%;width:1.45%;border-radius:.26cqw;background:linear-gradient(90deg,#133f53,#56aabe,#0b3d54)}
.riser.left{left:13%}.riser.right{left:85.2%}
.stream{position:absolute;inset:21% 0;border-radius:.2cqw;background:repeating-linear-gradient(105deg,#008ad3 0 1.8cqw,#74edff 2.6cqw,#008ad3 4cqw);transform:scaleX(0);transform-origin:left;z-index:2}
.running .stream,.ready .stream{transform:scaleX(1);transition:transform 1.55s linear;animation:flow .9s linear infinite}
@keyframes flow{to{background-position:4cqw 0}}
header{position:absolute;inset:2.4% 2.4% auto;display:flex;align-items:center;justify-content:space-between;gap:1cqw;color:white;background:#102b3ef5;border-radius:1.05cqw;padding:.9cqw 1.3cqw;box-shadow:0 .6cqw 1.5cqw #0d243743}
h1{font-size:clamp(14px,2.15cqw,38px);margin:0;line-height:1.1}
.tools{display:flex;gap:.45cqw}
button{font:inherit;font-weight:750;cursor:pointer;border:0;border-radius:.7cqw;line-height:1.16}
button:focus-visible{outline:3px solid #e3a143;outline-offset:3px}
button:disabled{cursor:default}
.tools button{padding:.58cqw .75cqw;background:#26475c;color:#fff;font-size:max(10px,1.02cqw)}
.scores{position:absolute;top:14%;left:14%;right:14%;display:grid;grid-template-columns:1fr auto 1fr;gap:1cqw;align-items:stretch}
.team,.count{background:#f9fbf7f5;border-radius:.8cqw;padding:.53cqw .86cqw;box-shadow:0 .2cqw .8cqw #12354122;border:2px solid transparent;font-weight:750;font-size:1.45cqw}
.team{display:flex;align-items:center;justify-content:space-between;gap:.4cqw}
.team.active{border-color:#0a718b;background:#e7fbff}
.team b{font-size:1.7cqw;color:#075f77}
.count{display:grid;place-items:center;min-width:6cqw}
.panel{position:absolute;top:24%;left:14%;width:72%;min-height:32%;padding:1.15cqw 1.5cqw 1.3cqw;background:#fffcf6fa;border:1px solid #fff;border-radius:1.3cqw;box-shadow:0 .8cqw 2.4cqw #0c263640}
.panel.illustrated{display:grid;grid-template-columns:1fr 38%;gap:1.25cqw;align-items:center}
.context{font-size:1.15cqw;font-weight:800;color:#18667d;margin:0 0 .55cqw}
h2{margin:0 0 .8cqw;font-size:2.4cqw;line-height:1.12}
p{margin:.45cqw 0 .9cqw;font-size:1.45cqw;line-height:1.3}
.actions{display:flex;gap:.7cqw}
.actions button{background:#0b617a;padding:.8cqw 1.1cqw;color:white;font-size:1.5cqw;min-height:3.15cqw}
.actions button:hover,.tools button:hover{filter:brightness(1.15)}
.choices button{flex:1;background:#e6f2f5;color:#143d52;border:1px solid #a8c7d2}
.status{font-weight:800;margin-bottom:.2cqw;color:#166344}
.status.wrong{color:#8b4509}
figure{margin:0}
figure img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;background:#e6d6bc;border-radius:.65cqw}
figcaption{font-size:1.06cqw;line-height:1.2;margin-top:.35cqw;color:#304a58}
figcaption.samples{display:flex;justify-content:space-around;font-weight:800}
.progress{position:absolute;bottom:4%;left:50%;translate:-50%;background:#102b3eed;color:white;border-radius:3cqw;padding:.55cqw 1.15cqw;font-size:1.25cqw;font-weight:750;white-space:nowrap}
#discussion{font-size:1.32cqw;line-height:1.27;margin:.6cqw 0 0;padding-left:2.1cqw}
#discussion li+li{margin-top:.43cqw}
.panel.illustrated{top:23%;left:12.5%;width:75%;grid-template-columns:1fr 46%}
.sample-art{position:relative;aspect-ratio:16/9;border-radius:.65cqw;overflow:hidden;background:#c4b4a2}
.sample-art img{position:absolute;inset:0;height:100%;object-fit:cover}
.sample-fallback{position:absolute;inset:18% 5%;display:flex;gap:6%}
.sample-fallback i{position:relative;flex:1;border:.5cqw solid #a8acaa;border-radius:14%;background:radial-gradient(#b58442 20%,transparent 23%) 0 0/.42cqw .47cqw,#dfb774;box-shadow:0 .45cqw .65cqw #0005}
.sample-fallback i:first-child::before{content:'';position:absolute;left:14%;top:35%;width:15%;height:22%;border-radius:35%;background:#876345;box-shadow:3cqw 1.5cqw #9b6e43,5cqw -.7cqw #8b6847}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:600px) and (orientation:portrait){
main{width:100%;aspect-ratio:auto;min-height:100dvh;overflow:visible;background:#eadbc7;padding:12px}
.scene{position:relative;aspect-ratio:16/9;z-index:0;border-radius:12px;overflow:hidden;background:linear-gradient(#a9d5f5 62%,#845c42 62% 75%,#dbb789 75% 81%,#624d40 81%);margin-top:12px}
header,.scores,.panel,.progress{position:static;width:auto;translate:none}
header{display:block;padding:14px;border-radius:12px}
h1{font-size:22px}.tools{margin-top:10px;flex-wrap:wrap;gap:5px}.tools button{padding:8px;font-size:12px}
.scores{margin:10px 0;gap:5px}.team,.count,.team b{font-size:13px}.team,.count{padding:5px}
.panel,.panel.illustrated{display:block;padding:16px;border-radius:12px}
.context,figcaption,.progress{font-size:13px}h2{font-size:22px}p{font-size:16px;margin:8px 0 12px}
.actions{gap:8px}.actions button{font-size:15px;padding:10px}.progress{text-align:center;margin:8px auto}
.panel.illustrated{width:auto}
#discussion{font-size:16px;padding-left:24px;margin:10px 0}
figure{margin-top:12px}
}
</style>
</head>

    'Түйірлер қажетті өлшемде болса да, қиыршықтаста шаң мен саз болуы мүмкін бе?'],
  [false, 'Бетонның беті тегіс болса, оның беріктігі жобаға сай деп қорытынды жасауға болады.',
    'Беттің тегістігіне қарап бетонның беріктігін анықтау мүмкін емес. Беріктікті сынақ нәтижесімен бағалайды.',
    'Екі бетон үлгісінің беті бірдей тегіс болса, олардың беріктігі де бірдей бола ма?'],
  [true, 'Бетонның беріктігін бағалау үшін сынақ нәтижесін жобада көрсетілген талаппен салыстырады.',
    'Сынақ нәтижесін жобадағы беріктік талабымен салыстырады.',
    'Сынақта алынған беріктік көрсеткішін қандай талаппен салыстырамыз?'],
  [true, 'Құм-қиыршықтас қоспасын бағалағанда түйірлердің өлшемдік құрамы мен бөгде қоспалардың мөлшері ескеріледі.',
    'Қоспаның түйір өлшемдері мен бөгде қоспалар мөлшерін қолдану мақсатына сай бағалайды.',
    'Қоспаның түйір өлшемдері сәйкес болса, оның құрамынан тағы нені тексеру керек?'],
  [false, 'Материалдың сапа құжаты болса, жеткізілген партияның сол құжатқа сәйкестігін тексеру қажет емес.',
    'Сапа құжатының жеткізілген партияға тиесілі екенін және ондағы көрсеткіштердің жобаға сәйкестігін тексереді.',
    'Сапа құжаты дәл осы партияға тиесілі екенін қалай анықтайсыңдар?']
];
const teams = ['Берік негіз', 'Дәл монтаж'];
const el = id => document.getElementById(id);
const slots = questions.map(() => {
  const slot = document.createElement('div');
  slot.className = 'slot';
  const pipe = document.createElement('div');
  pipe.className = 'pipe';
  slot.append(pipe);
  el('line').append(slot);
  return slot;
});
const risers = document.querySelectorAll('.riser');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let round, scores, attempts, installed, phase, timer;
let muted = false;
let audio, masterGain;
let activeSounds = new Set();

function enableAudio() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  if (!audio) {
    audio = new Audio();
    masterGain = audio.createGain();
    masterGain.gain.value = muted ? 0 : 0.65;
    masterGain.connect(audio.destination);
  }
  if (audio.state === 'suspended') audio.resume().catch(() => {});
}
function playSource(source, target, start, duration, volume) {
  const envelope = audio.createGain();
  envelope.gain.setValueAtTime(0.0001, start);
  envelope.gain.exponentialRampToValueAtTime(volume, start + 0.025);
  envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  source.connect(target || envelope);
  if (target) target.connect(envelope);
  envelope.connect(masterGain);
  activeSounds.add(source);
  source.onended = () => {
    activeSounds.delete(source);
    source.disconnect();
    if (target) target.disconnect();
    envelope.disconnect();
  };
  source.start(start);
  source.stop(start + duration);
}
function stopSounds() {
  for (const source of activeSounds) source.stop();
  activeSounds.clear();
}
function tone(hz, delay, duration, volume, type = 'sine') {
  const oscillator = audio.createOscillator();
  oscillator.type = type;
  oscillator.frequency.value = hz;
  playSource(oscillator, null, audio.currentTime + delay, duration, volume);
}
function sfx(kind) {
  if (muted || !audio) return;
  if (kind === 'correct') {
    [523.25, 659.25, 783.99].forEach((note, i) => tone(note, i * 0.09, 0.26, 0.13));
    tone(145, reducedMotion.matches ? 0.35 : 0.6, 0.08, 0.09, 'triangle');
  } else if (kind === 'wrong') {
    tone(311.13, 0, 0.17, 0.10);
    tone(233.08, 0.13, 0.22, 0.11);
  } else {
    const buffer = audio.createBuffer(1, Math.ceil(audio.sampleRate * 1.6), audio.sampleRate);
    const samples = buffer.getChannelData(0);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    const water = audio.createBufferSource();
    water.buffer = buffer;
    const filter = audio.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 630;
    playSource(water, filter, audio.currentTime, 1.6, 0.2);
    [523.25, 659.25, 783.99, 1046.5].forEach((note, i) =>
      tone(note, (reducedMotion.matches ? 0.1 : 1.25) + i * 0.11, 0.33, 0.11));
  }
}
function setText(id, value) {
  const node = el(id);
  node.textContent = value;
  node.hidden = !value;
}
function updateBoard() {
  el('count').textContent = (phase === 'intro' ? 0 : round + 1) + ' / 8';
  for (let i = 0; i < teams.length; i++) {
    const active = ['question', 'wrong', 'correct'].includes(phase) && i === round % 2;
    el('team' + i).classList.toggle('active', active);
    if (active) el('team' + i).setAttribute('aria-current', 'true');
    else el('team' + i).removeAttribute('aria-current');
    el('score' + i).textContent = scores[i];
  }
  el('progress').textContent = 'Жалғанған құбыр бөліктері · ' + installed + ' / 8';
}
function show({context, title, status = '', message = '', action = '', focus = true}) {
  setText('context', context);
  setText('title', title);
  setText('status', status);
  setText('message', message);
  setText('action', action);
  el('status').classList.toggle('wrong', phase === 'wrong');
  el('choices').hidden = phase !== 'question';
  const discussion = phase === 'topic';
  el('panel').classList.toggle('illustrated', discussion);
  el('figure').hidden = !discussion;
  el('discussion').hidden = !discussion;
  updateBoard();
  if (focus) el('title').focus({preventScroll: true});
}
function reset(focus = true) {
  clearTimeout(timer);
  stopSounds();
  phase = 'intro';
  round = attempts = installed = 0;
  scores = [0, 0];
  for (const slot of slots) slot.classList.remove('built');
  for (const riser of risers) riser.hidden = true;
  el('scene').classList.remove('running', 'ready');
  show({
    context: 'Өткен тақырыпқа шолу',
    title: 'Негіз материалдарының сапасына қойылатын талаптар',
    message: 'Тұжырымның шындық немесе жалған екенін анықтаңдар. Жалған тұжырымды түзетіңдер.',
    action: 'Ойынды бастау',
    focus
  });
}
function showQuestion() {
  phase = 'question';
  show({context: 'Жауап беретін топ · ' + teams[round % 2], title: questions[round][1]});
}
function answer(choice) {
  if (phase !== 'question') return;
  const [correct, title, explanation, hint] = questions[round];
  attempts++;
  const context = 'Жауап беретін топ · ' + teams[round % 2];
  if (choice !== correct) {
    phase = 'wrong';
    sfx('wrong');
    show({context, title, status: '↺ Тағы ойланып көріңдер', message: hint,
      action: 'Қайта жауап беру'});
    return;
  }
  phase = 'correct';
  if (attempts === 1) scores[round % 2]++;
  slots[installed].classList.add('built');
  installed++;
  risers[0].hidden = false;
  risers[1].hidden = installed !== questions.length;
  sfx('correct');
  show({context, title, status: '✓ Дұрыс жауап', message: explanation});
  timer = setTimeout(() => {
    setText('action', installed === questions.length ? 'Сынақ ағынын іске қосу' : 'Келесі тұжырым');
  }, reducedMotion.matches ? 0 : 650);
}
function runWater() {
  phase = 'flow';
  el('scene').classList.add('running');
  sfx('water');
  show({context:'Сынақ ағыны', title:'Су ғимаратқа қарай ағып жатыр'});
  timer = setTimeout(() => {
    phase = 'result';
    el('scene').classList.add('ready');
    const result = scores[0] === scores[1]
      ? 'Екі топтың ұпайы тең'
      : 'Жеңімпаз — «' + teams[scores[0] > scores[1] ? 0 : 1] + '»';
    show({context: 'Сынақ сәтті аяқталды', title: 'Құбыр желісі іске қосылды!',
      message: 'Берік негіз — ' + scores[0] + ' ұпай. Дәл монтаж — ' + scores[1] + ' ұпай. ' + result + '.',
      action: 'Қорытынды тапсырма'});
  }, reducedMotion.matches ? 30 : 1580);
}
el('action').addEventListener('click', () => {
  if (el('action').hidden) return;
  switch (phase) {
    case 'intro': enableAudio(); showQuestion(); break;
    case 'wrong': showQuestion(); break;
    case 'correct':
      if (installed === questions.length) runWater();
      else {
        round++;
        attempts = 0;
        showQuestion();
      }
      break;
    case 'result':
      phase = 'topic';
      show({context:'Қорытынды тапсырма', title:'Екі құм үлгісін салыстырыңдар'});
      break;
  }
});
el('truth').onclick = () => answer(true);
el('falsehood').onclick = () => answer(false);
el('reset').onclick = () => reset();
el('sound').onclick = () => {
  muted = !muted;
  if (muted) stopSounds();
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.65;
  if (!muted && phase !== 'intro') enableAudio();
  el('sound').textContent = muted ? 'Дыбыс өшірулі' : 'Дыбыс қосулы';
  el('sound').setAttribute('aria-pressed', String(!muted));
};
el('fullscreen').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    el('fullscreen').textContent = 'Толық экран · F11';
  }
};
document.addEventListener('fullscreenchange', () => {
  el('fullscreen').textContent = document.fullscreenElement ? 'Толық экраннан шығу' : 'Толық экран';
});
const illustration = el('illustration');
const hideMissingIllustration = () => { illustration.hidden = true; };
illustration.addEventListener('error', hideMissingIllustration);
if (illustration.complete && !illustration.naturalWidth) hideMissingIllustration();
const backdrop = el('backdrop');
const hideMissingBackdrop = () => { backdrop.hidden = true; };
backdrop.addEventListener('error', hideMissingBackdrop);
if (backdrop.complete && !backdrop.naturalWidth) hideMissingBackdrop();
reset(false);
</script>
</body>
</html>
